<div class="container">
  <mat-card class="card-container">
    <mat-card-header>
      <mat-card-title class="title">Acessos Clientes</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          <!-- Coluna Empresa -->
          <ng-container matColumnDef="empresa">
            <th mat-header-cell *matHeaderCellDef>Empresa</th>
            <td mat-cell *matCellDef="let item">
              <div class="empresa-cell">
                <mat-icon class="company-icon">business</mat-icon>
                <span class="empresa-name">{{item.empresa}}</span>
              </div>
            </td>
          </ng-container>

          <!-- Coluna Licenças -->
          <ng-container matColumnDef="licencas">
            <th mat-header-cell *matHeaderCellDef>Qtde Licenças</th>
            <td mat-cell *matCellDef="let item">
              <div class="licenca-badge">
                {{item.qtdeLicencas}}
              </div>
            </td>
          </ng-container>

     

          <!-- Coluna Ações -->
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let item">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item>
                  <mat-icon>visibility</mat-icon>
                  <span>Visualizar</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>edit</mat-icon>
                  <span>Editar</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>delete</mat-icon>
                  <span>Remover</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
